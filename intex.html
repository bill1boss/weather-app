<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App | Vasileios Katsotis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="weather-card">
    
    <!-- HEADER -->
    <header class="app-header">
      <h1>Weather App</h1>
      <p>Πρόγνωση καιρού σε πραγματικό χρόνο</p>
    </header>

    <!-- SEARCH BOX -->
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Εισάγετε πόλη (π.χ. Athens)..." autocomplete="off">
      <button id="search-btn">Search</button>
    </div>

    <!-- RESULTS CONTAINER -->
    <div class="weather-info hidden" id="weather-info">
      
      <!-- Τίτλος Πόλης -->
      <h2 id="city-name">--</h2>

      <!-- Κύρια Περιοχή Καιρού με Εικονίδιο -->
      <div class="weather-main">
        <img id="weather-icon" src="" alt="Weather Icon" class="weather-icon">
        <div class="temp-display">
          <span id="temperature">--</span>°C
        </div>
      </div>
      
      <!-- Περιγραφή & Αίσθηση Θερμοκρασίας -->
      <p id="description" class="weather-desc">--</p>
      <p class="feels-like">Αίσθηση ως <span id="feels-like-temp">--</span>°C</p>

      <!-- DETAIL GRID (4 Στοιχεία) -->
      <div class="weather-details">
        <div class="detail-item">
          <span class="label">Υγρασία</span>
          <span id="humidity" class="value">--%</span>
        </div>

        <div class="detail-item">
          <span class="label">Άνεμος</span>
          <span id="wind" class="value">-- km/h</span>
        </div>

        <div class="detail-item">
          <span class="label">Πίεση</span>
          <span id="pressure" class="value">-- hPa</span>
        </div>
      </div>

    </div>

    <!-- ERROR MESSAGE -->
    <p id="error-message" class="error-msg hidden"></p>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
