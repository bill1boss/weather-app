<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App | Vasileios Katsotis</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <div class="card" id="weather-card">
      <header class="app-header">
        <h1>🌤️ Weather App</h1>
        <p>Πρόγνωση καιρού σε πραγματικό χρόνο</p>
      </header>

      <div class="search-box">
        <input type="text" id="city-input" placeholder="🔍 Εισάγετε πόλη (π.χ. Athens)..." autocomplete="off">
        <button id="search-btn">Search</button>
      </div>

      <div class="weather-info hidden" id="weather-info">
        <h2 id="city-name">📍 --</h2>
        
        <div class="weather-main">
          <img id="weather-icon" src="" alt="Weather Icon" class="weather-icon">
          <div class="temp-display"><span id="temperature">--</span>°C</div>
        </div>
        
        <p id="description" class="weather-desc">--</p>
        <p class="feels-like">🌡️ Αίσθηση ως <span id="feels-like-temp">--</span>°C</p>

        <div class="weather-details">
          <div class="detail-item">
            <span class="icon">💧</span>
            <div class="detail-text">
              <span class="label">Υγρασία</span>
              <span id="humidity" class="value">--%</span>
            </div>
          </div>

          <div class="detail-item">
            <span class="icon">💨</span>
            <div class="detail-text">
              <span class="label">Άνεμος</span>
              <span id="wind" class="value">-- km/h</span>
            </div>
          </div>

          <div class="detail-item">
            <span class="icon">⏲️️</span>
            <div class="detail-text">
              <span class="label">Πίεση</span>
              <span id="pressure" class="value">-- hPa</span>
            </div>
          </div>
        </div>
      </div>

      <p id="error-message" class="error-msg hidden"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
