<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App | Vasileios Katsotis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-card">
    <h1>🌤️ Weather Forecast</h1>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name (e.g. London)...">
      <button id="search-btn">Search</button>
    </div>

    <!-- Main Current Weather Container -->
    <div id="weather-info" class="weather-info hidden">
      <h2 id="city-name">--</h2>
      <p id="temperature">--°C</p>
      <p id="weather-desc">--</p>
      <p id="humidity">Humidity: --%</p>
    </div>

    <!-- 3-Day Forecast Section -->
    <div id="forecast-section" class="forecast-section hidden">
      <h3>3-Day Forecast</h3>
      <div id="forecast-container" class="forecast-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
